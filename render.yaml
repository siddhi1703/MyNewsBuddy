services:
  - type: web
    name: mynewsbuddy-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SUPABASE_URL
        value: https://rajxtpjbwhcilvwyvrkz.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_LYt5UDCkuktF5D7chsiWIA_AQanjNQT
      - key: CHAT_REQUESTS_PER_MINUTE
        value: 10
